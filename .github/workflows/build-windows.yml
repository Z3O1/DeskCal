name: Build Windows (embedded Anki)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-embedded-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows x64 standalone
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-anki.txt
            tools/requirements-build.txt

      - name: Prepare fixed WebView2 SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.0.3856.49'
          $archive = Join-Path $env:RUNNER_TEMP 'webview2.nupkg'
          $unpacked = Join-Path $env:RUNNER_TEMP 'webview2-package'
          $sdk = Join-Path $env:RUNNER_TEMP 'webview2-sdk'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg" -OutFile $archive
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $unpacked)
          New-Item -ItemType Directory -Path $sdk -Force | Out-Null
          Copy-Item (Join-Path $unpacked 'lib/net462/Microsoft.Web.WebView2.Core.dll') $sdk
          Copy-Item (Join-Path $unpacked 'runtimes/win-x64/native/WebView2Loader.dll') $sdk
          Copy-Item (Join-Path $unpacked 'LICENSE.txt') (Join-Path $sdk 'WEBVIEW2-LICENSE.txt')
          "WEBVIEW2_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-FileHash $archive -Algorithm SHA256

      - name: Compile transparent WebView2 host
        run: |
          python tools/build_anki_host.py --sdk "$env:WEBVIEW2_SDK"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Build only: never run DeskCal.exe, import its main module, or run tests.
      - name: Build standalone application and source bundle
        run: |
          python -u tools/build.py --anki-host build/anki-host 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload standalone ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DeskCal-Windows-x64-${{ github.run_number }}
          path: |
            dist/DeskCal-*-windows-x64.zip
            dist/DeskCal-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DeskCal-Windows-build-log-${{ github.run_number }}
          path: |
            build-windows.log
            build/nuitka-report.xml
            nuitka-crash-report.xml
          if-no-files-found: ignore
          retention-days: 7
