name: Build Setup (existing Windows artifact)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful Build Windows run ID containing the matching standalone ZIP'
        required: true
        default: '46142279263'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-setup:
    name: Windows per-user Setup
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}

    steps:
      - name: Check out packaging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Download the successful standalone build
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN_ID -notmatch '^\d+$') { throw 'Invalid source run ID' }
          $repo = $env:GITHUB_REPOSITORY
          $run = gh api "repos/$repo/actions/runs/$env:SOURCE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.repository.full_name -ne $repo -or $run.path -ne '.github/workflows/build-windows.yml') {
            throw 'Select a successful Windows build from this repository'
          }
          $response = gh api "repos/$repo/actions/runs/$env:SOURCE_RUN_ID/artifacts" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifacts = @($response.artifacts | Where-Object { $_.name -match '^DeskCal-Windows-x64-\d+$' -and -not $_.expired })
          if ($artifacts.Count -ne 1) { throw 'Expected one unexpired standalone artifact' }
          $artifactName = $artifacts[0].name
          gh run download $env:SOURCE_RUN_ID --repo $repo --name $artifactName --dir input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SOURCE_COMMIT=$($run.head_sha)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare image build dependency
        run: |
          python -m pip install Pillow==13.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Compile the installer only. Never execute Setup.exe or DeskCal.exe.
      - name: Build Setup and release ZIP
        run: |
          $packages = @(Get-ChildItem input -Filter 'DeskCal-*-windows-x64.zip')
          if ($packages.Count -ne 1) { throw 'Expected one Windows ZIP' }
          $package = $packages[0].FullName
          python -u tools/build_setup.py --zip $package --source-run-id $env:SOURCE_RUN_ID --source-commit $env:SOURCE_COMMIT 2>&1 | Tee-Object -FilePath build-setup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Setup, ZIP and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DeskCal-Setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/DeskCal-*-Setup.exe
            dist/DeskCal-*-Setup.exe.sha256
            dist/DeskCal-*-windows-x64.zip
            dist/DeskCal-*-windows-x64.zip.sha256
            dist/setup-build-info.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload setup build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DeskCal-Setup-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-setup.log
          if-no-files-found: ignore
          retention-days: 7
